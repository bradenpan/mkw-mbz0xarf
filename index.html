<!DOCTYPE html>
<html lang="en">
<head>
<!-- Take down after Sun Oct 25 2026 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Magic Kingdom waits</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:17px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4f5f7;color:#1a1d21}
header{position:sticky;top:0;background:#14213d;color:#fff;padding:10px 14px;z-index:2}
h1{font-size:20px;margin:0}
#upd{font-size:15px;opacity:.9}
#banner{display:none;background:#b00020;color:#fff;font-weight:700;padding:10px 14px}
#banner.on{display:block}
main{padding:0 0 24px}
h2{font-size:18px;margin:18px 14px 6px;color:#14213d}
ul{list-style:none;margin:0;padding:0;background:#fff;border-top:1px solid #dcdfe4;border-bottom:1px solid #dcdfe4}
li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-top:1px solid #eceef1;min-height:52px}
li:first-child{border-top:0}
.n{min-width:0}
.nm{overflow-wrap:anywhere}
.ht{font-size:14px;color:#5a6270}
.ht.no{color:#b00020;font-weight:700}
.ht.un{color:#8a5a00;font-weight:700}
li.no{background:#fdecee}
.c{flex:none;min-width:76px;text-align:center;border-radius:8px;padding:6px 8px;font-weight:700;font-size:17px;background:#e6e9ee;color:#333}
.c.w1{background:#d7f3dd;color:#12602a}
.c.w2{background:#fff0c2;color:#6b4e00}
.c.w3{background:#ffd9d2;color:#8a1c0b}
.c.x{background:#e6e9ee;color:#555}
.c.d{background:#ffd9d2;color:#8a1c0b}
footer{padding:16px 14px;font-size:14px;color:#5a6270}
footer a{color:inherit}
@media (prefers-color-scheme:dark){
body{background:#101216;color:#e8eaee}ul{background:#1a1d23;border-color:#2b2f37}li{border-color:#2b2f37}
h2{color:#9db4e8}.ht{color:#9aa3b2}li.no{background:#3a1519}.ht.no{color:#ff8a98}.ht.un{color:#ffc266}
.c{background:#2b2f37;color:#e8eaee}.c.w1{background:#14391e;color:#8be0a3}.c.w2{background:#4a3a08;color:#ffd96b}
.c.w3,.c.d{background:#4a1a12;color:#ffa595}.c.x{background:#2b2f37;color:#aab}footer{color:#9aa3b2}}
</style>
</head>
<body>
<header><h1>Magic Kingdom waits</h1><div id="upd">Loading…</div></header>
<div id="banner" role="alert"></div>
<main id="app"></main>
<footer>Standby waits from <a href="https://themeparks.wiki">ThemeParks.wiki</a>. Backup source: <a href="https://queue-times.com">Queue-Times.com</a> (not fetched by this page). “Kai 42 in.” flags rides whose minimum height is above 42 in., per Disney’s ride pages. Waits are estimates and change quickly.</footer>
<script>
(function(){
var MAP=[{"land":"Main Street, U.S.A.","items":[["888fb4a4-7adf-47a1-8ba2-c258cc64fd75","Main Street Vehicles",0],["e39b831b-7731-49bb-815b-289b4f49a9fd","Walt Disney World Railroad - Main Street, U.S.A.",0],["a2d92647-634d-4eb4-886b-9da858e871f1","Meet Mickey at Town Square Theater",-1]]},{"land":"Adventureland","items":[["de737ffc-306b-4f32-8bbb-34e5d370ec8f","A Pirate's Adventure ~ Treasures of the Seven Seas",0],["796b0a25-c51e-456e-9bb8-50a324e301b3","Jungle Cruise",0],["352feb94-e52e-45eb-9c92-e4b44c6b1a9d","Pirates of the Caribbean",0],["30fe3c64-af71-4c66-a54b-aa61fd7af177","Swiss Family Treehouse",0],["96455de6-f4f1-403c-9391-bf8396979149","The Magic Carpets of Aladdin",0],["6fd1e225-53a0-4a80-a577-4bbc9a471075","Walt Disney's Enchanted Tiki Room",0]]},{"land":"Frontierland","items":[["de3309ca-97d5-4211-bffe-739fed47e92f","Big Thunder Mountain Railroad",38],["0f57cecf-5502-4503-8bc3-ba84d3708ace","Country Bear Musical Jamboree",0],["73cb9445-0695-47a3-87ce-d08ae36b5f3c","Tiana's Bayou Adventure",40]]},{"land":"Liberty Square","items":[["2551a77d-023f-4ab1-9a19-8afec0190f39","Haunted Mansion",0],["2ebfb38c-5cb5-4de1-86c0-f7af14188022","The Hall of Presidents",0]]},{"land":"Fantasyland","items":[["f5aad2d4-a419-4384-bd9a-42f86385c750","it's a small world",0],["f010bc01-b450-4476-a5f3-a5f2813104b2","Casey Jr. Splash 'N' Soak Station",0],["90d79335-c907-4069-a021-d0fe1ec73ae2","Cinderella Castle",-1],["890fa430-89c0-4a3f-96c9-11597888005e","Dumbo the Flying Elephant",0],["e76c93df-31af-49a5-8e2f-752c76c937c9","Enchanted Tales with Belle",0],["0aae716c-af13-4439-b638-d75fb1649df3","Mad Tea Party",0],["012a211b-4c91-451c-8a0e-5e3ab398eda8","Meet Ariel at Her Grotto",-1],["40737d3d-0ff6-4a9e-a050-beb87bf90120","Meet Cinderella and a Visiting Princess at Princess Fairytale Hall",-1],["cf4b2ba4-3626-4de7-9d07-abe8a65b1665","Meet Princess Tiana and a Visiting Princess at Princess Fairytale Hall",-1],["166f2985-7b27-4eff-a8b3-29c3448ba198","Meet Daring Disney Pals as Circus Stars at Pete's Silly Sideshow",-1],["b5d6d1d1-e960-4c8f-a8a4-b9748b386b64","Meet Dashing Disney Pals as Circus Stars at Pete's Silly Sideshow",-1],["7c5e1e02-3a44-4151-9005-44066d5ba1da","Mickey's PhilharMagic",0],["86a41273-5f15-4b54-93b6-829f140e5161","Peter Pan's Flight",0],["273ddb8d-e7b5-4e34-8657-1113f49262a5","Prince Charming Regal Carrousel",0],["9d4d5229-7142-44b6-b4fb-528920969a2c","Seven Dwarfs Mine Train",38],["924a3b2c-6b4b-49e5-99d3-e9dc3f2e8a48","The Barnstormer",35],["0d94ad60-72f0-4551-83a6-ebaecdd89737","The Many Adventures of Winnie the Pooh",0],["3cba0cb4-e2a6-402c-93ee-c11ffcb127ef","Under the Sea - Journey of The Little Mermaid",0],["e40ac396-cbac-43f4-8752-764ed60ccceb","Walt Disney World Railroad - Fantasyland",0]]},{"land":"Tomorrowland","items":[["d9d12438-d999-4482-894b-8955fdb20ccf","Astro Orbiter",0],["72c7343a-f7fb-4f66-95df-c91016de7338","Buzz Lightyear’s Space Ranger Spin",0],["e8f0b426-7645-4ea3-8b41-b94ae7091a41","Monsters, Inc. Laugh Floor",0],["b2260923-9315-40fd-9c6b-44dd811dbe64","Space Mountain",44],["5a43d1a7-ad53-4d25-abfe-25625f0da304","TRON Lightcycle / Run",48],["f163ddcd-43e1-488d-8276-2381c1db0a39","Tomorrowland Speedway",32],["ffcfeaa2-1416-4920-a1ed-543c1a1695c4","Tomorrowland Transit Authority PeopleMover",0],["8183f3f2-1b59-4b9c-b634-6a863bdf8d84","Walt Disney's Carousel of Progress",0]]},{"land":"Halloween Party","items":[["a74421f2-5de4-4425-bd06-8b4639b29826","Meet Festive Disney Pals at Mickey’s Not-So-Scary Halloween Party",-1],["947edbee-85a5-4aa0-99f3-14c7de539542","Meet Jack Skellington and Sally at Mickey's Not-So-Scary Halloween Party",-1],["5564113f-25b4-4646-ac35-aacf983e2fd6","Meet Mickey Mouse and Minnie Mouse at Mickey's Not-So-Scary Halloween Party",-1],["52ac3730-b955-452a-a7cc-17e3b06182ac","Trick-or-Treat Locations at Mickey's Not-So-Scary Halloween Party",-1]]}];
var KAI=42,POLL=60000,TIMEOUT=8000,FETCH_STALE=4*60000,FEED_STALE=10*60000;
var FEED="https://api.themeparks.wiki/v1/entity/75ea578a-adc8-4116-a54d-dccb60765ef9/live";
// local testing only: ?feed=<url> is honored on localhost
if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){var m=/[?&]feed=([^&]+)/.exec(location.search);if(m)FEED=decodeURIComponent(m[1]);}
var last=null,lastOk=0,feedTs=0,anyOpen=false,busy=false,known={};
var app=document.getElementById("app"),upd=document.getElementById("upd"),ban=document.getElementById("banner");
var tf=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hour:"numeric",minute:"2-digit"});
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function stale(){
  if(!last)return true;
  var now=Date.now();
  if(now-lastOk>FETCH_STALE)return true;
  if(anyOpen&&feedTs&&now-feedTs>FEED_STALE)return true;
  return false;
}
function chip(e,st){
  if(st)return['x','—'];
  if(!e)return['x','No data'];
  var s=e.status;
  if(s==="OPERATING"){
    var q=e.queue&&e.queue.STANDBY,w=q&&q.waitTime;
    if(typeof w==="number")return[w<=20?"w1":w<=45?"w2":"w3",w+" min"];
    return['x','Open'];
  }
  if(s==="DOWN")return['d','Down'];
  if(s==="REFURBISHMENT")return['x','Refurb'];
  if(s==="CLOSED")return['x','Closed'];
  return['x',esc(s||"No data")];
}
function ht(h,ride){
  if(h===-1)return["",""];
  if(h==null)return["height unverified","un"];
  if(h>KAI)return["Kai 42 in.: too short (min "+h+" in.)","no"];
  return[h>0?"Min "+h+" in.":"","" ];
}
function row(id,name,h,st){
  var e=last&&last[id],c=chip(e,st),t=ht(h);
  var cls=t[1]==="no"?' class="no"':'';
  return'<li'+cls+'><div class="n"><div class="nm">'+esc(name)+'</div>'+(t[0]?'<div class="ht '+t[1]+'">'+esc(t[0])+'</div>':'')+'</div><div class="c '+c[0]+'">'+c[1]+'</div></li>';
}
function render(){
  var st=stale(),html="",seen={};
  MAP.forEach(function(L){
    html+='<h2>'+esc(L.land)+'</h2><ul>';
    L.items.forEach(function(it){seen[it[0]]=1;html+=row(it[0],it[1],it[2],st)});
    html+='</ul>';
  });
  var other=[];
  if(last)Object.keys(last).forEach(function(id){var e=last[id];if(!seen[id]&&(e.entityType==="ATTRACTION"||(e.queue&&e.queue.STANDBY)))other.push(e)});
  if(other.length){
    html+='<h2>Other</h2><ul>';
    other.forEach(function(e){html+=row(e.id,e.name,null,st)});
    html+='</ul>';
  }
  app.innerHTML=html;
  if(!last){upd.textContent=lastOk?"":"Loading…";}
  if(lastOk)upd.textContent="Updated "+tf.format(new Date(lastOk))+" ET";
  if(st&&!last)ban.textContent="Times unavailable. Check back shortly.";
  else if(st)ban.textContent="Times are out of date (last good update "+tf.format(new Date(lastOk))+" ET). Numbers hidden until the feed recovers.";
  if(!st)ban.textContent="";
  ban.className=st?"on":"";
  if(st&&!lastOk)upd.textContent="No update yet";
}
function poll(){
  if(busy)return;busy=true;
  var ctl=new AbortController(),to=setTimeout(function(){ctl.abort()},TIMEOUT);
  fetch(FEED+(FEED.indexOf("?")<0?"?":"&")+"_="+Date.now(),{signal:ctl.signal,cache:"no-store"})
   .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
   .then(function(j){
     if(!j||!j.liveData)throw new Error("bad payload");
     var m={},ts=0,open=false;
     j.liveData.forEach(function(e){m[e.id]=e;
       if(e.entityType==="ATTRACTION"&&e.status==="OPERATING")open=true;
       if(e.entityType==="ATTRACTION"&&e.lastUpdated){var t=Date.parse(e.lastUpdated);if(t>ts)ts=t}});
     last=m;lastOk=Date.now();feedTs=ts;anyOpen=open;
   })
   .catch(function(){})
   .then(function(){clearTimeout(to);busy=false;render()});
}
document.addEventListener("visibilitychange",function(){if(!document.hidden){render();poll()}});
window.addEventListener("online",poll);
setInterval(poll,POLL);
setInterval(render,15000);
render();poll();
})();
</script>
</body>
</html>
